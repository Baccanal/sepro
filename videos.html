<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VIDEOS</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-metro.css"
    />
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-2017.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.min.css"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Tangerine"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Allerta+Stencil"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Sofia"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lobster&effect=shadow-multiple"
    />

    <link rel="icon" type="image/x-icon" href="images/vip/favicon.ico" />
    <link rel="stylesheet" href="css/sepro.css" />

    <script defer src="js/build.js"></script>
  </head>
  <body>
    <div class="container-xxl">
      <section class="w3-center" id="header"></section>
      <section class="" id="navigation"></section>

      <section class="w3-center intro">
        <div class="">VIDEOS 🏐</div>
      </section>

      <main class="">
        <div class="v-container">
          <div class="w3-row">
            <div class="w3-col m2"><img src="images/vip/star.png" /></div>
            <div class="w3-col m8">
              <figure class="main-video w3-cyan">
                <video src="videos/tornado.mp4" controls autoplay></video>
                <figcaption class="title">
                  Tornado is coming. We know what it brings!
                </figcaption>
              </figure>
            </div>
            <div class="w3-col m2"><img src="images/vip/star.png" /></div>
          </div>

          <div class="v-wrapper">
            <figure class="small-video">
              <video
                class="active video"
                src="videos/v1.mp4"
                controls
                muted
                autoplay
              ></video>
              <figcaption class="title">BustHead!</figcaption>
            </figure>

            <figure class="small-video">
              <video
                class="video"
                src="videos/v2.mp4"
                controls
                muted
                autoplay
              ></video>
              <figcaption class="title">Good Point!</figcaption>
            </figure>

            <figure class="small-video">
              <video
                class="video"
                src="videos/v3.mp4"
                controls
                muted
                autoplay
              ></video>
              <figcaption class="title">Good Hit!</figcaption>
            </figure>

            <figure class="small-video">
              <video
                class="video"
                src="videos/v4.mp4"
                controls
                muted
                autoplay
              ></video>
              <figcaption class="title">Nobody Move!</figcaption>
            </figure>
          </div>
        </div>
      </main>

      <section class="row text-center" id="footer"></section>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="js/video.js"></script>
  </body>
</html>
