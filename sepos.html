<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEPRO Website</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-metro.css"
    />
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-2017.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.min.css"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Tangerine"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Allerta+Stencil"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Sofia"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lobster&effect=shadow-multiple"
    />

    <link rel="icon" type="image/x-icon" href="images/vip/favicon.ico" />
    <link rel="stylesheet" href="css/sepro.css" />

    <script defer src="js/build.js"></script>
  </head>
  <body>
    <div class="container-xxl">
      <section id="header"></section>

      <section id="navigation"></section>

      <section class="w3-center intro">
        <div class="">SEP PLAYERS</div>
      </section>

      <main class="w3-center">
        <div
          class="w3-flex w3-margin w3-padding w3-2017-tawny-port w3-border w3-border-white"
          style="gap: 1.5rem; justify-content: center; flex-wrap: wrap"
        >
          <button
            id="btn15"
            class="w3-btn bold w3-amber w3-round w3-border w3-border-white"
          >
            UNDER 15
          </button>
          <button
            id="btn17"
            class="w3-btn bold w3-amber w3-round w3-border w3-border-white"
          >
            UNDER 17
          </button>
          <button
            id="btn20"
            class="w3-btn bold w3-amber w3-round w3-border w3-border-white"
          >
            OPEN
          </button>
        </div>

        <div class="content">
          <h3 id="headcard" class="sep"></h3>
          <div
            id="players"
            class="w3-flex w3-margin"
            style="
              gap: 6rem;
              justify-content: center;
              flex-wrap: wrap;
              align-items: center;
            "
          ></div>
        </div>
      </main>

      <section id="footer"></section>
    </div>

    <script src="js/myFunctions.js"></script>
    <script src="js/players.js"></script>
    <script src="js/sepos.js"></script>
  </body>
