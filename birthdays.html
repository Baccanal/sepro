<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEPRO Website</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css" />
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-metro.css"
    />

    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-colors-2017.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.min.css"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Tangerine"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Allerta+Stencil"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Sofia"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lobster&effect=shadow-multiple"
    />

    <link rel="icon" type="image/x-icon" href="images/vip/favicon.ico" />
    <link rel="stylesheet" href="css/sepro.css" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://kit.fontawesome.com/3b53121f7c.js"
      crossorigin="anonymous"
    ></script>
    <script defer src="js/build.js"></script>

    <script></script>

    <style>
      .cheer {
        padding: 5px;
        text-align: center;

        margin: auto;
      }

      #confettiBtn {
        font-size: 20px;
        border: solid 1px #c3c3c3;
      }
    </style>
  </head>
  <body>
    <div class="container-xxl">
      <section class="w3-center" id="header"></section>

      <section class="" id="navigation"></section>

      <section class="w3-center intro">
        <div class="w3-col m3">💐</div>
        <div class="w3-col m6 w3-center">
          <div class="w3-center">BIRTHDAYS</div>
        </div>
        <div class="w3-col m3">🎂</div>
      </section>

      <main class="w3-center">
        <div
          class="w3-flex"
          style="
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 5 px;
          "
          id="birthday"
        >
          <div class="w3-center">
            <div class="w3-card w3-margin w3-white w3-border w3-border-black">
              <h3 id="today" class="w3-panel w3-metro-dark-red w3-center">
                Today
              </h3>
              <div class="w3-margin">
                <h2>SORRY!</h2>
                <h3>No Birthdays Today!</h3>
                <h4>Checkout who's birthday's upcoming.</h4>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-12">
          <div class="intro p-1"><b>UPCOMING BIRTHDAYS</b></div>

          <div
            class="w3-flex"
            style="
              flex-wrap: wrap;
              justify-content: space-around;
              align-items: center;
              gap: 5 px;
            "
            id="birthmonth"
          >
            No Birthdays!
          </div>
        </div>
      </main>

      <section id="footer"></section>
    </div>

    <script src="js/build.js"></script>

    <script src="js/myFunctions.js"></script>
    <script src="js/players.js"></script>
    <script src="js/birthday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <script src="js/confetti.js"></script>
  </body>
</html>
